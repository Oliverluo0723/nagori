name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # 轉譜模型（約 0.9 MB）套件裡就有，複製進 public/ 一起部署
      - run: mkdir -p public/models && cp -r node_modules/@spotify/basic-pitch/model public/models/basic-pitch
      # Pages 網址在 /<repo 名>/ 底下；分軌模型 172 MB 進不了 git，直接從 Hugging Face 抓
      - run: pnpm build --base="/$REPO_NAME/"
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_STEMS_MODEL_URL: https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
